services:
  - type: web
    name: gather-gift
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    preDeployCommand: flask --app backend db upgrade
    healthCheckPath: /ready
    disk:
      name: family-gift-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_TYPE
        value: mysql
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        value: /app/backend/certs/railway-mysql-ca.crt
      - key: RATELIMIT_STORAGE_URI
        value: "appsql://"
      - key: FRONTEND_ORIGIN
        value: https://gather-gift.onrender.com
      # The client uses same-origin /api requests; no separate API origin is needed.
      - key: SERPAPI_API_KEY
        sync: false
      # Optional eBay application keys. Set privately after eBay approval.
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_ENVIRONMENT
        value: production
      - key: EBAY_MARKETPLACE_ID
        value: EBAY_US
      - key: EBAY_AFFILIATE_CAMPAIGN_ID
        value: ""
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: AMAZON_ASSOCIATE_TAG
        value: ""
      - key: STORE_AFFILIATE_RULES
        value: "{}"
      - key: ADS_DAILY_RATE_CENTS
        value: "0"
      - key: ADS_WISHLIST_DAILY_RATE_CENTS
        value: "0"
      - key: ADS_FOLLOWING_DAILY_RATE_CENTS
        value: "0"
      - key: ADS_DISCOVER_DAILY_RATE_CENTS
        value: "0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
