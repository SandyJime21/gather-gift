name: MVP checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mvp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=1
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      SESSION_TYPE: cachelib
      DATABASE_URL: mysql+pymysql://root:ci-local-only@127.0.0.1:3306/gather_gift_ci
      SMTP_HOST: ''
      MAIL_FROM: ''
      SERPAPI_API_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-local-only
          MYSQL_DATABASE: gather_gift_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python scripts/release_check.py
      - run: python -m pytest backend/tests -q
      - name: Migrate an empty MySQL database and verify the schema
        run: |
          flask --app backend db upgrade
          flask --app backend db check
      - name: Build the deployment image
        run: docker build -t gather-gift-ci .
